            <section class="games-workspace mb-4">
              <header class="view-hero mb-4">
                <cc-section-header
                  kicker="Study Queue"
                  title="Find the right game to review next."
                  subtitle="Filter by result, opening, mistakes, and analysis status so the game list behaves like a study tool instead of a raw archive."
                ></cc-section-header>
              </header>

              <!-- Preset chips -->
              <div class="games-preset-row" id="games-preset-row">
                <button class="preset-btn btn btn-ghost" data-preset="recent-losses" type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 7L7 17M7 7l10 10"/></svg>
                  Recent Losses
                </button>
                <button class="preset-btn btn btn-ghost" data-preset="high-mistakes" type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  High Mistakes
                </button>
                <button class="preset-btn btn btn-ghost" data-preset="needs-coach" type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  Needs Coach Note
                </button>
                <button class="preset-btn btn btn-ghost" data-preset="strong-opponents" type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                  Strong Opponents
                </button>
              </div>

              <!-- Filter toggle + clear -->
              <div class="games-filter-toggle-row mt-3">
                <button
                  id="btn-toggle-games-filters"
                  class="games-filter-toggle btn btn-ghost"
                  type="button"
                  aria-expanded="false"
                  aria-controls="games-filter-panel"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                  <span>Filters</span>
                  <span id="games-filters-active-count" class="games-filter-count"></span>
                </button>
                <button class="btn btn-ghost games-filter-toggle games-clear-btn" id="btn-clear-games-filters" type="button">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  Clear
                </button>
              </div>

              <!-- Filter panel -->
              <div class="games-filter-panel filter-bar mt-2 p-4 max-sm:p-3" id="games-filter-panel" hidden>
                <div class="games-filter-grid grid grid-cols-4 gap-3 max-md:grid-cols-2 max-sm:grid-cols-1">
                  <label class="field">
                    <span class="field-label">Search</span>
                    <input id="games-search" class="field-input input input-bordered w-full" type="search" placeholder="Opening, ECO, rating, date" />
                  </label>
                  <label class="field">
                    <span class="field-label">Opening / ECO</span>
                    <input id="games-opening" class="field-input input input-bordered w-full" type="search" placeholder="Sicilian, B20, London" />
                  </label>
                  <label class="field">
                    <span class="field-label">Color</span>
                    <select id="games-color" class="field-input select select-bordered w-full">
                      <option value="">All colors</option>
                      <option value="white">White</option>
                      <option value="black">Black</option>
                    </select>
                  </label>
                  <label class="field">
                    <span class="field-label">Result</span>
                    <select id="games-result" class="field-input select select-bordered w-full">
                      <option value="">All results</option>
                      <option value="win">Win</option>
                      <option value="loss">Loss</option>
                      <option value="draw">Draw</option>
                    </select>
                  </label>
                  <label class="field">
                    <span class="field-label">Status</span>
                    <select id="games-analyzed" class="field-input select select-bordered w-full">
                      <option value="">All statuses</option>
                      <option value="1">Analyzed</option>
                      <option value="0">Pending</option>
                      <option value="2">Error</option>
                    </select>
                  </label>
                  <label class="field">
                    <span class="field-label">Coach Note</span>
                    <select id="games-journal" class="field-input select select-bordered w-full">
                      <option value="">All games</option>
                      <option value="0">Missing note</option>
                      <option value="1">Has note</option>
                    </select>
                  </label>
                  <label class="field">
                    <span class="field-label">Mistakes</span>
                    <select id="games-min-mistakes" class="field-input select select-bordered w-full">
                      <option value="0">All games</option>
                      <option value="1">1+ mistakes</option>
                      <option value="5">5+ mistakes</option>
                      <option value="10">10+ mistakes</option>
                    </select>
                  </label>
                  <label class="field">
                    <span class="field-label">Sort</span>
                    <select id="games-sort" class="field-input select select-bordered w-full">
                      <option value="date_desc">Newest first</option>
                      <option value="date_asc">Oldest first</option>
                      <option value="mistakes_desc">Most mistakes</option>
                      <option value="opponent_desc">Highest opponent rating</option>
                      <option value="opponent_asc">Lowest opponent rating</option>
                    </select>
                  </label>
                </div>

                <div class="games-filter-footer mt-3 flex items-center justify-between gap-2 border-t border-[var(--border)] pt-3 max-sm:flex-col max-sm:items-start">
                  <div class="meta-label" id="games-filter-summary">All games</div>
                  <div class="games-filter-buttons flex flex-wrap gap-1 max-sm:grid max-sm:w-full max-sm:grid-cols-3">
                    <button class="btn btn-ghost btn-sm" id="btn-save-filter-slot-1" type="button">Save S1</button>
                    <button class="btn btn-ghost btn-sm" id="btn-load-filter-slot-1" type="button">Load S1</button>
                    <button class="btn btn-ghost btn-sm" id="btn-save-filter-slot-2" type="button">Save S2</button>
                    <button class="btn btn-ghost btn-sm" id="btn-load-filter-slot-2" type="button">Load S2</button>
                    <button class="btn btn-ghost btn-sm" id="btn-save-filter-slot-3" type="button">Save S3</button>
                    <button class="btn btn-ghost btn-sm" id="btn-load-filter-slot-3" type="button">Load S3</button>
                    <button class="btn btn-ghost btn-sm" id="btn-export-games-csv" type="button">Export CSV</button>
                    <button class="btn btn-ghost btn-sm" id="btn-copy-games-summary" type="button">Copy Summary</button>
                  </div>
                </div>
              </div>
            </section>

            <!-- Games table -->
            <div class="games-table-card card panel-quiet overflow-hidden">
              <div class="games-table-header card-header flex items-center justify-between border-b border-[var(--border)] px-4 py-3 max-sm:flex-col max-sm:items-start max-sm:gap-1">
                <div class="flex items-center gap-2">
                  <div class="card-title">All Games</div>
                </div>
                <div class="meta-label" id="games-count-label"></div>
              </div>
              <div class="table-shell overflow-x-auto">
                <table class="table-relaxed">
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Color</th>
                      <th>Result</th>
                      <th>Opp. Rating</th>
                      <th>Opening</th>
                      <th>Mistakes</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="all-games-body">
                    <tr><td colspan="8"><cc-skeleton variant="row"></cc-skeleton></td></tr>
                    <tr><td colspan="8"><cc-skeleton variant="row"></cc-skeleton></td></tr>
                    <tr><td colspan="8"><cc-skeleton variant="row"></cc-skeleton></td></tr>
                    <tr><td colspan="8"><cc-skeleton variant="row"></cc-skeleton></td></tr>
                    <tr><td colspan="8"><cc-skeleton variant="row"></cc-skeleton></td></tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Pagination -->
            <div class="games-pagination mt-3">
              <button class="btn btn-ghost games-page-btn" id="btn-prev" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
                Prev
              </button>
              <span class="games-page-label" id="page-label">Page 1</span>
              <button class="btn btn-ghost games-page-btn" id="btn-next" type="button">
                Next
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
