<!DOCTYPE html>
<html lang="en" data-theme="chesscoach">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal chess coaching dashboard for Tushar9038"
    />
    <meta
      name="robots" content="noindex, nofollow, noarchive" />
    <title>Chess Coach — Tushar9038</title>
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"
      integrity="sha256-vOFUCAlZxXS+C7axqST/MvCOvG/0YMFZFx9RxTgCyEQ="
      crossorigin="anonymous"
      defer
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <link rel="preload" href="/static/css/app.css" as="style" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <noscript>
      <div class="noscript-panel">
        <h2>Chess Coach requires JavaScript</h2>
        <p>Please enable JavaScript to use this dashboard.</p>
      </div>
    </noscript>

    <div class="app app-shell flex min-h-dvh max-sm:pb-[calc(64px+env(safe-area-inset-bottom))]">
      <!-- ── SIDEBAR ── -->
      <aside class="sidebar fixed inset-y-0 left-0 z-[100] flex h-dvh flex-col border-r border-[var(--border)] shadow-cc-soft max-sm:inset-x-0 max-sm:bottom-0 max-sm:top-auto max-sm:z-[120] max-sm:h-auto max-sm:w-full max-sm:border-r-0 max-sm:border-t" id="sidebar" aria-label="Navigation">
        <div class="sidebar-logo flex min-h-7 items-center gap-1 border-b border-[var(--border)] px-3 pb-2 pt-3 max-sm:hidden">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M8 16c0-1 .5-2 1.5-2.5L12 12l2.5 1.5C15.5 14 16 15 16 16v2H8v-2z"
            />
            <path d="M12 3v4M9 6h6M9 7c0 1.66 1.34 3 3 3s3-1.34 3-3" />
            <rect x="6" y="18" width="12" height="3" rx="1" />
          </svg>
          <div>
            <div class="sidebar-logo-text">Chess Coach</div>
            <div class="sidebar-logo-sub">Tushar9038</div>
          </div>
        </div>

        <nav class="sidebar-nav flex flex-1 flex-col gap-1 px-1 py-2 max-sm:flex-row max-sm:items-stretch max-sm:justify-between max-sm:gap-[6px] max-sm:px-[max(8px,env(safe-area-inset-left))] max-sm:pt-[6px] max-sm:pb-[calc(6px+env(safe-area-inset-bottom))] max-sm:pr-[max(8px,env(safe-area-inset-right))]" aria-label="Main navigation">
          <button class="nav-item active shadow-none max-sm:min-h-[48px] max-sm:flex-col max-sm:justify-center max-sm:gap-[2px] max-sm:rounded-[10px] max-sm:px-[6px] max-sm:py-2" data-view="dashboard" type="button" aria-current="page">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
            <span class="max-sm:block max-sm:max-w-full max-sm:overflow-hidden max-sm:text-ellipsis max-sm:whitespace-nowrap max-sm:text-[10px] max-sm:leading-[1.1]">Dashboard</span>
          </button>
          <button class="nav-item shadow-none max-sm:min-h-[48px] max-sm:flex-col max-sm:justify-center max-sm:gap-[2px] max-sm:rounded-[10px] max-sm:px-[6px] max-sm:py-2" data-view="games" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
              />
            </svg>
            <span class="max-sm:block max-sm:max-w-full max-sm:overflow-hidden max-sm:text-ellipsis max-sm:whitespace-nowrap max-sm:text-[10px] max-sm:leading-[1.1]">Games</span>
          </button>
          <button class="nav-item shadow-none max-sm:min-h-[48px] max-sm:flex-col max-sm:justify-center max-sm:gap-[2px] max-sm:rounded-[10px] max-sm:px-[6px] max-sm:py-2" data-view="mistakes" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span class="max-sm:block max-sm:max-w-full max-sm:overflow-hidden max-sm:text-ellipsis max-sm:whitespace-nowrap max-sm:text-[10px] max-sm:leading-[1.1]">Mistakes</span>
          </button>
          <button class="nav-item shadow-none max-sm:min-h-[48px] max-sm:flex-col max-sm:justify-center max-sm:gap-[2px] max-sm:rounded-[10px] max-sm:px-[6px] max-sm:py-2" data-view="openings" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
              />
            </svg>
            <span class="max-sm:block max-sm:max-w-full max-sm:overflow-hidden max-sm:text-ellipsis max-sm:whitespace-nowrap max-sm:text-[10px] max-sm:leading-[1.1]">Openings</span>
          </button>
          <button class="nav-item shadow-none max-sm:min-h-[48px] max-sm:flex-col max-sm:justify-center max-sm:gap-[2px] max-sm:rounded-[10px] max-sm:px-[6px] max-sm:py-2" data-view="drills" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
            <span class="max-sm:block max-sm:max-w-full max-sm:overflow-hidden max-sm:text-ellipsis max-sm:whitespace-nowrap max-sm:text-[10px] max-sm:leading-[1.1]">Drills</span><span id="drill-badge" class="nav-badge max-sm:right-1 max-sm:top-1 max-sm:ml-0 max-sm:min-w-4 max-sm:px-[5px] max-sm:text-[10px]" hidden></span>
          </button>
          <button class="nav-item shadow-none max-sm:min-h-[48px] max-sm:flex-col max-sm:justify-center max-sm:gap-[2px] max-sm:rounded-[10px] max-sm:px-[6px] max-sm:py-2" data-view="coach" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
              <path d="M8 9h8M8 13h5" />
            </svg>
            <span class="max-sm:block max-sm:max-w-full max-sm:overflow-hidden max-sm:text-ellipsis max-sm:whitespace-nowrap max-sm:text-[10px] max-sm:leading-[1.1]">Coach</span>
          </button>
        </nav>

        <div class="sidebar-footer border-t border-[var(--border)] p-2 max-sm:hidden">
          <div class="rating-badge flex items-center justify-between rounded-cc border border-[var(--border)] bg-[var(--surface-2)] p-2">
            <div>
              <div class="rating-badge-label">Current Rating</div>
              <div class="rating-badge-value" id="sidebar-rating">—</div>
            </div>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--primary)"
              stroke-width="2"
            >
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
              <polyline points="17 6 23 6 23 12" />
            </svg>
          </div>
        </div>
      </aside>

      <!-- ── MAIN ── -->
      <main class="main flex min-h-dvh flex-1 flex-col max-sm:ml-0">
        <header class="topbar sticky top-0 z-50 flex min-h-4 items-center justify-between gap-2 border-b border-[var(--border)] px-5 shadow-cc-soft backdrop-blur max-sm:min-h-[56px] max-sm:px-3">
          <div class="topbar-main flex min-w-0 items-center gap-2">
            <button
              class="btn btn-ghost topbar-sidebar-toggle max-sm:hidden"
              id="btn-sidebar-toggle"
              type="button"
              aria-label="Toggle sidebar"
              aria-expanded="true"
              aria-controls="sidebar"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
            <div>
              <div class="topbar-breadcrumb max-sm:hidden" id="topbar-breadcrumb">Workspace / Dashboard</div>
              <div class="topbar-title" id="topbar-title">Dashboard</div>
            </div>
          </div>
          <div class="topbar-actions relative z-[140] flex items-center gap-1 pointer-events-auto">
            <button
              class="btn btn-ghost topbar-actions-toggle hidden max-sm:inline-flex pointer-events-auto"
              id="btn-actions-menu"
              type="button"
              aria-expanded="false"
              aria-controls="topbar-actions-list"
            >
              Actions
            </button>
            <div class="topbar-actions-list flex gap-1 rounded-[calc(var(--radius)+4px)] border border-[var(--border)] bg-[rgba(22,27,34,0.9)] p-[2px] shadow-cc-soft max-sm:absolute max-sm:right-0 max-sm:top-[calc(100%+8px)] max-sm:z-[130] max-sm:hidden max-sm:min-w-[180px] max-sm:flex-col max-sm:p-1 max-sm:data-[open=true]:flex" id="topbar-actions-list" data-open="false">
              <button class="btn btn-ghost max-sm:w-full max-sm:justify-start" id="btn-sync" type="button">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                Sync
              </button>
              <button
                class="btn btn-ghost max-sm:w-full max-sm:justify-start"
                id="btn-analyze"
                type="button"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                Analyze
              </button>
              <button class="btn btn-ghost max-sm:w-full max-sm:justify-start" id="btn-db-maintenance" type="button">
                DB Optimize
              </button>
              <button class="btn btn-ghost max-sm:w-full max-sm:justify-start" id="btn-toggle-motion" type="button" aria-pressed="false">
                Reduce Motion
              </button>
            </div>
          </div>
        </header>

        <div class="content page-shell mx-auto w-full max-w-[1480px] flex-1 p-6 max-md:p-4 max-sm:p-3">
          <!-- ── DASHBOARD VIEW ── -->
          <div class="view active" id="view-dashboard"></div>

          <!-- ── GAMES VIEW ── -->
          <div class="view" id="view-games"></div>

          <!-- ── GAME DETAIL VIEW ── -->
          <div class="view" id="view-game-detail"></div>

          <!-- ── MISTAKES VIEW ── -->
          <div class="view" id="view-mistakes"></div>

          <!-- ── OPENINGS VIEW ── -->
          <div class="view" id="view-openings"></div>

          <!-- ── DRILLS VIEW ── -->
          <div class="view" id="view-drills"></div>

          <!-- ── COACH VIEW ── -->
          <div class="view" id="view-coach"></div>
        </div>
        <!-- /content -->
      </main>
      <!-- /main -->
    </div>
    <!-- /app -->
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
